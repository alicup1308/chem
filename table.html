<!DOCTYPE html>
<!-- language: HTML, file: table.html, target: periodic table page -->
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Periodic Table — Atrax Co.</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/helper.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html">
      <span class="logo">Cf</span>
      <span data-i18n="brand">ChemForge</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="table.html" class="active" data-i18n="nav.table">Periodic Table</a></li>
        <li><a href="about.html" data-i18n="nav.about">About</a></li>
      </ul>
    </nav>
    <div class="controls">
      <button class="btn icon-btn" id="themeBtn" title="Theme" aria-label="Theme">🌗</button>
      <button class="btn lang-btn" id="langBtn">العربية</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="page-head">
    <h1 class="section-title" data-i18n="el.title">Interactive Periodic Table</h1>
    <p class="section-sub" data-i18n="el.sub">All 118 elements. Click any one to see its electron configuration and full details.</p>
  </section>

  <section class="table-controls">
    <div class="search-box">
      <input type="text" id="elSearch" placeholder="Search…" data-i18n-placeholder="el.search" autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="Clear">✕</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="ptable-wrap">
    <div class="ptable-scroll">
      <div class="ptable" id="ptable"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="noresult" id="noResMsg"></div>
  </section>

</main>

<footer>
  <div class="wrap footer-inner">
    <span data-i18n="footer.copy">© 2026 ChemForge — Made with heat.</span>
    <span data-i18n="footer.tag">Learn. React. Repeat.</span>
  </div>
</footer>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-grid">
      <div class="modal-left">
        <div class="el-hero" id="elHero"></div>
        <div class="shell-stage" id="shellStage"></div>
      </div>
      <div class="modal-right" id="modalRight"></div>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/elements.js"></script>
<script src="js/app.js"></script>
<script src="js/shells.js"></script>
<script src="js/table.js"></script>
<script src="js/helper.js"></script>
</body>
</html>
